[package]
name = "charts-demo"
version = "0.5.0"
edition = "2024"
# Generates typed `res::` constants from `resource/` (see build.rs).
build = "build.rs"
publish = false

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/reference/project-structure).
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit"]
material = ["day/material"]
winui = ["day/winui"]
xaml = ["day/xaml"]
arkui = ["day/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
# Day dependencies accept every stable 0.x release; Cargo.lock records the tested versions.
day = { package = "day-app", version = "0.*" }
# Every page, from the gallery crate beside the piece, by path: a change to the piece, its
# examples and this shell land in one pull request and one CI run. Another app mounts the same
# pages from git:
#     day-piece-charts-gallery = "0.*"
day-piece-charts-gallery = { version = "0.*", path = "../gallery" }

[build-dependencies]
day-build = "0.*"

[workspace]
