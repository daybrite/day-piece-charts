name: chart-interactions
description: Shared queries, brush summaries, overview/detail, legends, links and navigation.
flow:
  - navigate: { route: interactive-linked }
  - wait_for: { id: linked_primary }
  - assert_text: { id: linked_count, key: day_piece_charts_gallery::inter_count, args: { count: 0 } }
  - tap: { id: linked_select_sample }
  - assert_text: { id: linked_count, key: day_piece_charts_gallery::inter_count, args: { count: 1 } }
  - screenshot: interactive-linked
  - tap: { id: linked_reset }
  - navigate: { route: interactive-brush }
  - wait_for: { id: brush_source }
  - assert_text: { id: brush_count, key: day_piece_charts_gallery::inter_count, args: { count: 60 } }
  - drag: { id: brush_source, from: [80, 40], to: [250, 130] }
  - pause: { secs: 1 } # Let the filtered summary animation settle.
  - screenshot: interactive-brush
  - tap: { id: brush_source, at: [350, 80] }
  - assert_text: { id: brush_count, key: day_piece_charts_gallery::inter_count, args: { count: 60 } }
  - navigate: { route: interactive-overview }
  - wait_for: { id: overview_source }
  - drag: { id: overview_source, from: [80, 30], to: [220, 100] }
  - screenshot: interactive-overview
  - tap: { id: overview_source, at: [350, 80] }
  - navigate: { route: interactive-legend }
  - wait_for: { id: legend_donut }
  - tap: { id: 'interactive-legend-Group A' }
  - screenshot: interactive-legend
  - tap: { id: legend_reset }
  - navigate: { route: interactive-cells }
  - wait_for: { id: interactive_cells }
  - tap: { id: interactive_cells, at: [90, 80] }
  - screenshot: interactive-cells
  - navigate: { route: interactive-viewport }
  - wait_for: { id: interactive_viewport }
  - tap: { id: viewport_zoom_in }
  - drag: { id: interactive_viewport, from: [140, 90], to: [170, 110] }
  - screenshot: interactive-viewport
  - tap: { id: viewport_reset }
  - navigate: { route: interactive-compose }
  - wait_for: { id: compose_intersection }
  - tap: { id: 'compose-series-Group B' }
  - drag: { id: compose_intersection, from: [70, 40], to: [240, 130] }
  - screenshot: interactive-compose
  - tap: { id: compose_intersection, at: [350, 80] }
  - assert_text: { id: compose_count, key: day_piece_charts_gallery::inter_count, args: { count: 20 } }
  - navigate: { route: interactive-links }
  - wait_for: { id: interactive_links }
  - tap: { id: 'link-series-Group B' }
  - assert_text: { id: link_target, key: day_piece_charts_gallery::inter_link_target, args: { target: 'sample:1' } }
  - screenshot: interactive-links
  - navigate: { route: interactive-filtered }
  - wait_for: { id: filtered_source }
  - drag: { id: filtered_source, from: [80, 40], to: [250, 130] }
  - screenshot: interactive-filtered
  - tap: { id: filtered_source, at: [350, 80] }
  - assert_text: { id: filtered_count, key: day_piece_charts_gallery::inter_count, args: { count: 60 } }
  - navigate: { route: interactive-inputs }
  - wait_for: { id: inputs_picker }
  - select: { id: inputs_picker, index: 1 }
  - assert_text: { id: inputs_count, key: day_piece_charts_gallery::inter_count, args: { count: 20 } }
  - tap: { id: 'input-group-Group C' }
  - assert_value: { id: inputs_picker, value: 3 }
  - assert_text: { id: inputs_count, key: day_piece_charts_gallery::inter_count, args: { count: 20 } }
  - screenshot: interactive-inputs
