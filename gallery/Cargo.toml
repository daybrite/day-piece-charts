[package]
name = "day-piece-charts-gallery"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
description = "The day-piece-charts example pages, shared by the Charts Demo app and any app that wants to show them"
repository = "https://github.com/daybrite/day-piece-charts"
license = "MPL-2.0"

# The examples the crate's README documents, as pages an app can mount: the Charts Demo is a
# sidebar of them, and Day-Showcase shows the same pages under its Charts section. One copy of the
# code, so the two can never drift apart.
#
# A library of pages rather than an app: no window, no backend features, and its strings in a
# private catalog (resource/locales, https://daybrite.dev/docs/how-to/localization "Private catalogs"),
# so they resolve in whichever app mounts it without that app installing them. Like the chart
# crate, every day dependency names the bare canonical URL so the app's Cargo.lock picks one day
# revision for the whole graph.

[dependencies]
day = { package = "day-app", version = "0.*" }
day-localization-ui = "0.*"
day-piece-charts = { path = "..", version = "0.*" }

[dev-dependencies]
day-core = "0.*"
day-mock = "0.*"
day-spec = "0.*"
day-reactive = "0.*"

[build-dependencies]
day-build = "0.*"

# Lint policy: Clippy's `pedantic` group, and CI treats every warning as an error. This table
# matches the one in `day`.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Day converts between float layout units and the integer pixel, index and FFI types of eight
# native toolkits. `as` is the only operator for float-to-integer, and these four lints cannot
# tell that from a narrowing integer cast, so they would need an exception at nearly every site.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Function length and short or similar names are style limits this codebase does not follow:
# geometry is written in `x`/`y`/`w`/`h`, and a backend's realize and patch arms stay in one place.
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
# A backend module imports the whole spec vocabulary, and which names it uses differs with the
# backend feature and target, so an explicit list is unused or incomplete under some of them.
wildcard_imports = "allow"
# Option structs and backend calls mirror native toolkit flags, which are booleans.
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
# Asks for `#[must_use]` on nearly every function that returns a value, including ones called
# for their effect. Builders are still covered by `return_self_not_must_use`.
must_use_candidate = "allow"
