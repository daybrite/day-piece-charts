[package]
name = "day-piece-charts"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
description = "A grammar-of-graphics charting piece for Day apps, drawn on the canvas"
repository = "https://github.com/daybrite/day-piece-charts"
license = "MPL-2.0"

# An external Day Piece (https://daybrite.dev/contributing/extending) with no native half. Every chart is
# recorded as a `Draw` display list and replayed by whatever backend the app runs on, so this crate
# carries no per-toolkit code, no `[features]` for backends, and no `[package.metadata.day.piece]`
# `backends` entry, the same shape day::colorpicker's composed idiom has inside day. One
# consequence worth stating: a chart looks identical on all nine targets, because it is identical.
#
# Daybrite-owned dependencies accept every stable 0.x release. Apps retain a tested
# dependency set with Cargo.lock; updating it may require source changes.

[package.metadata.day]
# Accept the pre-1.0 series; source compatibility between releases is not guaranteed.
compat = "0.*"

[dependencies]
day-spec = "0.*"
day-core = "0.*"
day-pieces = "0.*"
day-reactive = "0.*"
day-geometry = "0.*"
# Axis labels are numbers, and a number is locale-dependent: grouping separators, the decimal
# mark, and the grouping rule itself (en-IN groups by lakh). day-localization already carries the icu4x
# formatter every Day app links, so this edge adds a call, not a dependency.
day-localization = "0.*"

[dev-dependencies]
day-mock = "0.*"

# Lint policy: Clippy's `pedantic` group, and CI treats every warning as an error. This table
# matches the one in `day`.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Day converts between float layout units and the integer pixel, index and FFI types of eight
# native toolkits. `as` is the only operator for float-to-integer, and these four lints cannot
# tell that from a narrowing integer cast, so they would need an exception at nearly every site.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Function length and short or similar names are style limits this codebase does not follow:
# geometry is written in `x`/`y`/`w`/`h`, and a backend's realize and patch arms stay in one place.
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
# A backend module imports the whole spec vocabulary, and which names it uses differs with the
# backend feature and target, so an explicit list is unused or incomplete under some of them.
wildcard_imports = "allow"
# Option structs and backend calls mirror native toolkit flags, which are booleans.
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
# Asks for `#[must_use]` on nearly every function that returns a value, including ones called
# for their effect. Builders are still covered by `return_self_not_must_use`.
must_use_candidate = "allow"
