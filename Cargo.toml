[package]
name = "day-piece-charts"
version = "0.4.2"
edition = "2024"
rust-version = "1.89"
description = "A grammar-of-graphics charting piece for Day apps, drawn on the canvas"
repository = "https://github.com/daybrite/day-piece-charts"
license = "MPL-2.0"

# An external Day Piece (https://daybrite.dev/contributing/extending) with no native half. Every chart is
# recorded as a `Draw` display list and replayed by whatever backend the app runs on, so this crate
# carries no per-toolkit code, no `[features]` for backends, and no `[package.metadata.day.piece]`
# `backends` entry, the same shape day::colorpicker's composed idiom has inside day. One
# consequence worth stating: a chart looks identical on all nine targets, because it is identical.
#
# Daybrite-owned dependencies accept every stable 0.x release. Apps retain a tested
# dependency set with Cargo.lock; updating it may require source changes.

[package.metadata.day]
# Accept the pre-1.0 series; source compatibility between releases is not guaranteed.
compat = "0.*"

[dependencies]
day-spec = "0.*"
day-core = "0.*"
day-pieces = "0.*"
day-reactive = "0.*"
day-geometry = "0.*"
# Axis labels are numbers, and a number is locale-dependent: grouping separators, the decimal
# mark, and the grouping rule itself (en-IN groups by lakh). day-localization already carries the icu4x
# formatter every Day app links, so this edge adds a call, not a dependency.
day-localization = "0.*"

[dev-dependencies]
day-mock = "0.*"
